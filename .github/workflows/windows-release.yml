name: Windows x64 build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build x64 Windows packages
        run: npm run build:win
      - name: Verify release files
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "JARVIS-Setup-x64.exe" -Recurse | Select-Object -First 1
          $portable = Get-ChildItem -Path dist -Filter "JARVIS-Portable-x64.exe" -Recurse | Select-Object -First 1
          if (-not $installer) { throw "Installer missing: JARVIS-Setup-x64.exe" }
          if (-not $portable) { throw "Portable build missing: JARVIS-Portable-x64.exe" }
          foreach ($file in @($installer, $portable)) {
            if ($file.Length -lt 1MB) { throw "Artifact unexpectedly small: $($file.FullName)" }
            Get-FileHash $file.FullName -Algorithm SHA256 | Format-List
          }
      - name: Upload executable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-x64
          path: |
            dist/**/JARVIS-Setup-x64.exe
            dist/**/JARVIS-Portable-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/JARVIS-Setup-x64.exe
            dist/**/JARVIS-Portable-x64.exe
