name: Build and smoke-test JARVIS Windows x64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-online
      - name: Typecheck all TypeScript projects
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Generate application icon
        shell: pwsh
        run: ./scripts/generate-icon.ps1
      - name: Build installer and portable executable
        run: npm run dist:all
      - name: Verify artifact names, PE architecture and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item 'release/JARVIS-Setup-x64.exe'
          $portable = Get-Item 'release/JARVIS-Portable-x64.exe'
          foreach ($file in @($installer, $portable)) {
            if ($file.Length -lt 1MB) { throw "Artifact unexpectedly small: $($file.Name)" }
            $stream = [System.IO.File]::OpenRead($file.FullName)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              if ($reader.ReadUInt16() -ne 0x5A4D) { throw "Not a PE executable: $($file.Name)" }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "Invalid PE signature: $($file.Name)" }
              $machine = $reader.ReadUInt16()
              if ($machine -ne 0x8664) { throw "Expected x64 PE (0x8664), got 0x$($machine.ToString('X4')): $($file.Name)" }
            } finally { $stream.Dispose() }
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            Write-Host "$($file.Name) SHA256 $($hash.Hash)"
          }
      - name: Windows install, launch and uninstall smoke tests
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - name: Ensure a CI report exists
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          if (!(Test-Path 'release/windows-smoke-report.txt')) {
            @('JARVIS Windows x64 CI report', "Workflow conclusion: ${{ job.status }}", 'Smoke tests did not complete; inspect preceding failed steps.') | Set-Content 'release/windows-smoke-report.txt' -Encoding UTF8
          }
      - name: Upload release artifacts and smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64
          path: |
            release/JARVIS-Setup-x64.exe
            release/JARVIS-Portable-x64.exe
            release/windows-smoke-report.txt
          if-no-files-found: warn
          retention-days: 90

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Windows-x64
          path: release
      - name: Publish tagged GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/JARVIS-Setup-x64.exe
            release/JARVIS-Portable-x64.exe
            release/windows-smoke-report.txt
          generate_release_notes: true
